version: "3.9"

services:
  web:
    build: .
    ports:
      - "8090:80"
    env_file:
      - .env
    volumes:
      - ./app:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:5.7
    container_name: barangelektronik_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${AIVEN_PASSWORD}
      MYSQL_DATABASE: ${AIVEN_DATABASE}
      MYSQL_USER: ${AIVEN_USER}
      MYSQL_PASSWORD: ${AIVEN_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
